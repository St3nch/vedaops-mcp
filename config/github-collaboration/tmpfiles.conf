# Template only. Do not apply without separate CHAZ authorization.
# Policy, the App key, and the provider executable stay outside the
# service-writable journal. Only the journal is owned by vedaops-github.
d /etc/vedaops-github 0755 root root -
d /usr/local/lib/vedaops-github 0755 root root -
d /var/lib/vedaops-github 0755 root root -
d /var/lib/vedaops-github/operations 0700 vedaops-github vedaops-github -
