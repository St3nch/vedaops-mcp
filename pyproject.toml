[project]
name = "vedaops-mcp"
version = "0.1.0"
description = "Governed VedaOps development control plane"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.4.5,<4",
]

[project.scripts]
vedaops-mcp = "vedaops_mcp.entrypoints:main"
vedaops-github = "vedaops_mcp.github_collab.entrypoints:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vedaops_mcp"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
