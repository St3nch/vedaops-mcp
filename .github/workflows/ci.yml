name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  portable-admission:
    name: Portable admission
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: latest-known
          python-version: "3.12"
          enable-cache: false

      - name: Install locked dependencies
        run: uv sync --frozen --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Compile sources and tests
        run: uv run python -m compileall -q src tests

      - name: Build wheel
        run: uv build --wheel --offline --out-dir dist

      - name: Run portable tests
        run: uv run pytest -q tests/test_cli.py tests/test_settings.py --tb=short
